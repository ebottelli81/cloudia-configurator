<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Configuratore Cloudia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cockpit diagnostico. Aurora e pavimento a griglia dietro pannelli di vetro; a sinistra i passi guidati, a destra la distinta con la vista tecnica in pianta. */
:root{
  --paper:#060912; --card:rgba(15,21,40,.64); --card-solid:#0E1428; --card-2:rgba(150,175,255,.06); --field:rgba(150,175,255,.07); --dev:#26315A;
  --ink:#E9EEFB; --ink-2:#93A0C0; --line:rgba(150,175,255,.16); --line-2:rgba(150,175,255,.36);
  --accent:#FF7A2E; --accent-ink:#160800; --glow:rgba(255,122,46,.5); --spot:rgba(255,122,46,.15); --halo:rgba(255,122,46,.28);
  --a1:rgba(255,106,28,.30); --a2:rgba(70,90,255,.34); --a3:rgba(30,230,210,.15); --fgrid:rgba(120,150,255,.22); --pgrid:rgba(150,175,255,.05);
  --scr:#03060D; --scr-trace:#3DEBD8;
  --ok:#5FD39B; --warn:#F0B84E; --crit:#FF8A80;
  --ok-bg:rgba(95,211,155,.12); --warn-bg:rgba(240,184,78,.12); --crit-bg:rgba(255,138,128,.13);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 22px 44px -26px rgba(0,0,0,.85);
  --f-d:"Unbounded","Avenir Next","Segoe UI",sans-serif;
  --f-b:"Onest","Segoe UI",system-ui,sans-serif;
  --f-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --paper:#E9EFF8; --card:rgba(255,255,255,.74); --card-solid:#FFFFFF; --card-2:rgba(20,45,100,.05); --field:#FFFFFF; --dev:#D5DFF0;
    --ink:#0D1A35; --ink-2:#4F6082; --line:rgba(20,45,100,.14); --line-2:rgba(20,45,100,.3);
    --accent:#D2490E; --accent-ink:#FFFFFF; --glow:rgba(210,73,14,.32); --spot:rgba(210,73,14,.11); --halo:rgba(210,73,14,.16);
    --a1:rgba(255,120,50,.26); --a2:rgba(80,110,255,.22); --a3:rgba(30,200,190,.18); --fgrid:rgba(30,60,140,.16); --pgrid:rgba(20,45,100,.05);
    --scr:#0A1424; --scr-trace:#38E8D2;
    --ok:#12714A; --warn:#8F5A06; --crit:#B3261E;
    --ok-bg:#DFF3E8; --warn-bg:#FBEFD6; --crit-bg:#FADFDC;
    --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 38px -24px rgba(20,45,100,.35);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --paper:#E9EFF8; --card:rgba(255,255,255,.74); --card-solid:#FFFFFF; --card-2:rgba(20,45,100,.05); --field:#FFFFFF; --dev:#D5DFF0;
  --ink:#0D1A35; --ink-2:#4F6082; --line:rgba(20,45,100,.14); --line-2:rgba(20,45,100,.3);
  --accent:#D2490E; --accent-ink:#FFFFFF; --glow:rgba(210,73,14,.32); --spot:rgba(210,73,14,.11); --halo:rgba(210,73,14,.16);
  --a1:rgba(255,120,50,.26); --a2:rgba(80,110,255,.22); --a3:rgba(30,200,190,.18); --fgrid:rgba(30,60,140,.16); --pgrid:rgba(20,45,100,.05);
  --scr:#0A1424; --scr-trace:#38E8D2;
  --ok:#12714A; --warn:#8F5A06; --crit:#B3261E;
  --ok-bg:#DFF3E8; --warn-bg:#FBEFD6; --crit-bg:#FADFDC;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 18px 38px -24px rgba(20,45,100,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0;font:15px/1.55 var(--f-b);color:var(--ink);background-color:var(--paper);
  padding-block:18px 36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Atmosfera */
#aur{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#aur .b{position:absolute;width:62vmax;height:62vmax;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);animation:drift 26s ease-in-out infinite alternate;will-change:transform}
#aur .b1{--c:var(--a1);left:-18vmax;top:-26vmax}
#aur .b2{--c:var(--a2);right:-24vmax;top:6vmax;animation-duration:33s;animation-delay:-9s}
#aur .b3{--c:var(--a3);left:22vw;bottom:-34vmax;animation-duration:39s;animation-delay:-17s}
#aur::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--pgrid) 1px,transparent 1px),linear-gradient(90deg,var(--pgrid) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(ellipse at 50% 30%,#000,transparent 75%)}
#aur .floor{position:absolute;left:-25%;right:-25%;bottom:0;height:46vh;perspective:420px;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 85%);mask-image:linear-gradient(to top,#000 5%,transparent 85%)}
#aur .floor i{position:absolute;inset:0;overflow:hidden;transform-origin:50% 100%;transform:rotateX(64deg)}
#aur .floor i::before{content:"";position:absolute;left:0;right:0;top:-64px;bottom:0;background-image:linear-gradient(var(--fgrid) 1px,transparent 1px),linear-gradient(90deg,var(--fgrid) 1px,transparent 1px);background-size:64px 64px;animation:flow 3.2s linear infinite}
@keyframes drift{to{transform:translate3d(9vmax,7vmax,0) scale(1.16)}}
@keyframes flow{to{transform:translateY(64px)}}
#sweep{position:fixed;top:0;bottom:0;left:0;width:34vw;z-index:6;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,var(--spot) 70%,var(--glow));border-right:2px solid var(--accent);box-shadow:8px 0 40px var(--glow)}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{width:50px;height:32px;flex:none;filter:drop-shadow(0 0 7px var(--glow))}
.brand svg polyline{stroke-dasharray:130;stroke-dashoffset:130;animation:logodraw 3.6s ease-in-out infinite}
@keyframes logodraw{0%{stroke-dashoffset:130}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-130}}
.brand b{font:600 clamp(14px,2vw,18px)/1.1 var(--f-d);letter-spacing:-.01em}
.brand b .g{background:linear-gradient(90deg,var(--accent),#FFB347);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font:500 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.bcbtn{font:500 12px var(--f-m);border:1px solid var(--line-2);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;gap:9px;align-items:center;transition:border-color .2s,box-shadow .2s}
.bcbtn:hover{border-color:var(--accent);box-shadow:0 0 22px -6px var(--glow)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{position:relative;display:inline-flex;padding:3px;border:1px solid var(--line-2);border-radius:999px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang i{position:absolute;top:3px;bottom:3px;left:3px;width:38px;border-radius:999px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#FFB347));box-shadow:0 0 18px -4px var(--glow);transform:translateX(calc(var(--k,0) * 38px));transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.lang button{position:relative;z-index:1;width:38px;height:30px;border:0;background:none;cursor:pointer;font:500 11.5px var(--f-m);letter-spacing:.08em;color:var(--ink-2);transition:color .3s;border-radius:999px}
.lang button[aria-pressed="true"]{color:var(--accent-ink)}
.lang button:hover:not([aria-pressed="true"]){color:var(--ink)}
.relang{animation:relang .55s ease}
@keyframes relang{from{opacity:.15;filter:blur(6px)}}
.tgl svg{width:16px;height:16px;flex:none}
.tgl .i-sun{display:none}
.tgl[data-mode="dark"] .i-sun{display:block}
.tgl[data-mode="dark"] .i-moon{display:none}
.tgl:hover svg{transform:rotate(25deg)}
.tgl svg{transition:transform .4s}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 10px var(--warn);animation:blink 2.4s ease-in-out infinite}
.dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok)}
@keyframes blink{50%{opacity:.4}}

/* Passi */
.steps{position:relative;display:flex;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);box-shadow:var(--shadow);overflow:hidden}
.stbtns{display:flex;flex:1;min-width:0}
.steps .fill{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,transparent,var(--accent));transition:width .9s cubic-bezier(.2,.8,.2,1);z-index:1}
.steps .fill::after{content:"";position:absolute;right:-5px;top:-4px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px 3px var(--glow)}
.st{flex:1 1 0;min-width:0;padding:13px 16px;border:0;border-right:1px solid var(--line);background:none;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--ink-2);transition:background .3s,color .3s}
.st:last-child{border-right:0}
.st .no{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font:500 11px var(--f-m);flex:none;transition:all .4s}
.st .no svg{width:14px;height:14px}
.st .tx{min-width:0;display:grid;gap:1px}
.st small{font:500 10px var(--f-m);letter-spacing:.12em;text-transform:uppercase}
.st b{font:600 12.5px/1.2 var(--f-d);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st:hover:not(:disabled){background:var(--card-2)}
.st.done .no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st[aria-current="step"]{background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 12%,transparent))}
.st[aria-current="step"] .no{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 0 var(--glow),inset 0 0 12px -2px var(--glow);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--glow),inset 0 0 12px -2px var(--glow)}70%,100%{box-shadow:0 0 0 12px transparent,inset 0 0 12px -2px var(--glow)}}
.st:disabled{opacity:.4;cursor:not-allowed}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:22px;align-items:start}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;min-width:0;transition:opacity .22s ease,transform .22s ease,filter .22s ease}
.main[data-leave="f"]{opacity:0;transform:translateX(-46px) scale(.985);filter:blur(10px)}
.main[data-leave="b"]{opacity:0;transform:translateX(46px) scale(.985);filter:blur(10px)}
h2{font:600 clamp(22px,2.9vw,34px)/1.12 var(--f-d);letter-spacing:-.035em;margin:0;text-wrap:balance}
h3{font:600 14.5px/1.25 var(--f-d);margin:0;letter-spacing:-.01em}
.lede{margin:10px 0 0;color:var(--ink-2);max-width:62ch}
.eyebrow{display:flex;align-items:center;gap:9px;font:500 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 10px var(--glow);flex:none}
.panel{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--x,50%) var(--y,50%),var(--spot),transparent 70%)}
.panel:hover::before{opacity:1}
.pad{padding:20px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--field);padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;transition:all .2s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 22px -4px var(--glow)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(222px,1fr));gap:16px}
.ccard,.pcard{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .28s ease-out,border-color .25s,box-shadow .25s;will-change:transform}
.ccard{padding:14px;display:grid;gap:9px;text-align:left;cursor:pointer;align-content:start}
.ccard:hover,.pcard:hover{border-color:var(--accent);box-shadow:var(--shadow),0 0 36px -10px var(--glow)}
.ccard::after,.pcard::after{content:"";position:absolute;inset:7px;pointer-events:none;opacity:0;transition:opacity .25s,inset .25s;
  background:
  linear-gradient(var(--accent),var(--accent)) top left/13px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) top left/1.5px 13px no-repeat,
  linear-gradient(var(--accent),var(--accent)) top right/13px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) top right/1.5px 13px no-repeat,
  linear-gradient(var(--accent),var(--accent)) bottom left/13px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) bottom left/1.5px 13px no-repeat,
  linear-gradient(var(--accent),var(--accent)) bottom right/13px 1.5px no-repeat,linear-gradient(var(--accent),var(--accent)) bottom right/1.5px 13px no-repeat}
.ccard:hover::after,.pcard:hover::after{opacity:1;inset:4px}
.ccard b{font:600 15px/1.2 var(--f-d);letter-spacing:-.02em}
.ccard p{margin:0;color:var(--ink-2);font-size:13.5px}
.ccard .n{font:500 10.5px var(--f-m);color:var(--accent);letter-spacing:.12em;text-transform:uppercase}
.art{position:relative;overflow:hidden;background:radial-gradient(70% 80% at 50% 48%,var(--halo),transparent 72%),var(--card-2);border-radius:11px;height:140px}
.art img,.art svg{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);max-width:none}
.art img{object-fit:contain;transition:transform .55s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 10px 14px rgba(0,0,0,.28))}
.ccard:hover .art img,.pcard:hover .art img{transform:scale(1.07) translateY(-3px)}
.art::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-110%)}
.ccard:hover .art::after,.pcard:hover .art::after{animation:sheen .9s ease}
@keyframes sheen{to{transform:translateX(110%)}}
.thumb{width:54px;height:54px;object-fit:contain;background:radial-gradient(circle,var(--halo),transparent 75%),var(--card-2);border-radius:10px;flex:none;padding:3px}
.shl{display:flex;gap:12px;align-items:center;min-width:0}
.a-body{fill:var(--dev);stroke:var(--ink);stroke-width:1.5}
.a-scr{fill:var(--scr)}
.a-tr{fill:none;stroke:var(--scr-trace);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.a-slot{fill:var(--line-2)}
.a-key{fill:var(--accent)}
.a-ln{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round}
.pcard{padding:14px;display:grid;gap:12px;align-content:start;cursor:pointer}
.ph{display:flex;justify-content:space-between;align-items:start;gap:8px}
.ph b{font:600 17px/1.1 var(--f-d);letter-spacing:-.03em}
.ptag{font-size:13px;color:var(--ink-2);margin:5px 0 0}
.badge{font:500 10px var(--f-m);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap}
.specs{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:0;font-size:13px}
.specs dt{color:var(--ink-2)}
.specs dd{margin:0}
.pf{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap}
.price{font:500 17px var(--f-m);font-variant-numeric:tabular-nums}
.price small{font-size:11px;color:var(--ink-2);margin-right:5px}
.stock{font:500 11.5px var(--f-m);display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.stock i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.stock.mid i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.stock.no i{background:var(--crit);box-shadow:0 0 8px var(--crit)}
.btn{position:relative;overflow:hidden;font:600 14px var(--f-b);padding:10px 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--field);cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .25s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 62%,#FFB347));color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 26px -8px var(--glow)}
.btn.pri:hover{box-shadow:0 10px 34px -4px var(--glow)}
.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%)}
.btn.pri:hover::after{animation:sheen .8s ease}
.btn:disabled{opacity:.55;cursor:wait}
.bar3{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px}
.bar3 b{font:600 17px var(--f-d);letter-spacing:-.03em}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;background:var(--field)}
.stp button{width:34px;height:34px;border:0;background:none;cursor:pointer;font-size:18px;transition:background .15s,color .15s}
.stp button:hover{background:var(--accent);color:var(--accent-ink)}
.stp output{min-width:34px;text-align:center;font:500 14px var(--f-m)}
.grp{display:grid;gap:12px}
.gd{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}
.opts{display:grid;gap:9px}
.opt{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:start;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;transition:border-color .2s,background .3s,transform .2s,box-shadow .3s}
.opt:hover:not(.off){border-color:var(--line-2);transform:translateX(4px)}
.opt.qty{grid-template-columns:1fr auto auto;align-items:center;cursor:default}
.opt.qty:hover{transform:none}
.opt input{appearance:none;-webkit-appearance:none;margin:2px 0 0;width:19px;height:19px;border:1.5px solid var(--line-2);background:var(--field);display:grid;place-content:center;cursor:pointer;transition:all .25s}
.opt input[type=checkbox]{border-radius:6px}
.opt input[type=radio]{border-radius:50%}
.opt input::after{content:"";width:9px;height:9px;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1);background:var(--accent-ink)}
.opt input[type=checkbox]::after{clip-path:polygon(14% 52%,0 66%,38% 100%,100% 24%,86% 10%,38% 70%)}
.opt input[type=radio]::after{border-radius:50%}
.opt input:checked{background:var(--accent);border-color:var(--accent);box-shadow:0 0 14px -2px var(--glow)}
.opt input:checked::after{transform:scale(1)}
.opt input:disabled{cursor:not-allowed}
.opt.on{border-color:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 13%,var(--card)),var(--card) 70%);box-shadow:0 0 30px -14px var(--glow)}
.opt.off{opacity:.5;cursor:not-allowed}
.opt.pop{animation:pop .65s ease-out}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--glow)}100%{box-shadow:0 0 0 18px transparent}}
.om b{font-weight:600;display:block}
.om small{display:block;color:var(--ink-2);font-size:13px}
.om em{display:block;font:500 11.5px var(--f-m);font-style:normal;margin-top:4px;color:var(--warn)}

const S={step:1,care:null,cat:null,pid:null,qty:1,sel:{},cust:{name:'',vat:'',email:'',contact:'',bcno:'',ref:'',notes:'',group:'LISTINO'},tried:false,busy:false,result:null,payload:null};
const prod=()=>P.find(p=>p.id===S.pid);
const appl=x=>!!S.pid&&x.fam.includes(prod().fam);
const isIncl=x=>appl(x)&&!!x.incl&&x.incl.includes(prod().fam);
const on=id=>{const x=OBJ[id];return !!x&&appl(x)&&(isIncl(x)||(S.sel[id]||0)>0)};
const appAny=x=>(x.reqAny||[]).filter(i=>appl(OBJ[i]));
function reqOk(x){
  if(x.req&&!x.req.every(on))return false;
  const a=appAny(x); if(a.length&&!a.some(on))return false;
  return true;
}
function blockedBy(x){
  for(const id of (x.excl||[])) if(on(id))return OBJ[id];
  for(const y of O) if(on(y.id)&&(y.excl||[]).includes(x.id))return y;
  return null;
}
function turnOn(id,cnt){
  const x=OBJ[id]; if(isIncl(x))return;
  if(x.kind==='radio') O.filter(y=>y.grp===x.grp&&y.id!==id).forEach(y=>{delete S.sel[y.id]});
  S.sel[id]=cnt||1;
  (x.excl||[]).forEach(e=>{delete S.sel[e]});
  (x.req||[]).forEach(r=>{if(!on(r)){turnOn(r,1);toast(u('toastAdd',t(OBJ[r].name),t(x.name)))}});
  const a=appAny(x);
  if(a.length&&!a.some(on)){turnOn(a[0],1);toast(u('toastAdd',t(OBJ[a[0]].name),t(x.name)))}
}
function prune(){
  let ch=true;
  while(ch){ch=false;for(const id of Object.keys(S.sel)){const x=OBJ[id];if(!appl(x)||!reqOk(x)){delete S.sel[id];ch=true;toast(u('toastRem',t(x.name)))}}}
}
function initSel(){
  S.sel={};const f=prod().fam;
  O.filter(appl).forEach(x=>{if(x.def&&x.def.includes(f)&&!isIncl(x))S.sel[x.id]=1});
}
function groupRequired(items){return items[0].kind==='radio'&&items.some(x=>x.def&&x.def.includes(prod().fam))}
const volPct=q=>q>=10?12:q>=5?8:q>=3?5:0;
function lines(){
  const p=prod(),L=[{id:p.sku,name:p.name,qty:S.qty,unit:p.price,grp:'dev'}];
  const rank=g=>GORD.indexOf(g);
  O.filter(appl).sort((a,b)=>rank(a.grp)-rank(b.grp)).forEach(x=>{
    const inc=isIncl(x),c=S.sel[x.id]||0;
    if(!inc&&!c)return;
    const qty=x.kind==='qty'?c:(x.per==='unit'?S.qty:1);
    L.push({id:x.id,name:x.name,qty,unit:inc?0:x.price,inc,rec:!!x.rec,grp:x.grp});
  });
  return L;
}
function totals(){
  const L=lines(),vp=volPct(S.qty),gp=PG.find(g=>g.id===S.cust.group).pct;
  const gross=L.reduce((a,l)=>a+l.qty*l.unit,0);
  const volD=L[0].qty*L[0].unit*vp/100;
  const afterVol=gross-volD, grpD=afterVol*gp/100, net=afterVol-grpD;
  const rec=L.filter(l=>l.rec).reduce((a,l)=>a+l.qty*l.unit,0)*(1-gp/100);
  return {L,vp,gp,gross,volD,grpD,net,vat:net*0.22,total:net*1.22,rec};
}
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().padStart(5,'0').slice(-5)}
function cfgCode(){
  const k=Object.keys(S.sel).sort().map(i=>i+':'+S.sel[i]).join('|')+'#'+S.qty;
  return ('CFG-'+prod().sku.replace(/^[A-Z]+-/,'')+'-'+hash(k)).slice(0,35);
}
function stockInfo(p,q){
  if(p.stock>=q)return {c:'',t:u('stockOk',p.stock)};
  if(p.stock>0)return {c:'mid',t:u('stockMid',p.stock,p.lead)};
  return {c:'no',t:u('stockNo',p.lead)};
}
function hints(){
  const p=prod(),f=p.fam,H=[],q=S.qty;
  if(f==='bench'&&!on('OF-SCRF')&&!on('OF-SCRG'))H.push(['in',u('hScreen')]);
  if(DESK.includes(f)&&(on('OF-MARM1')||on('OF-MARM2'))&&!on('OF-TRAY'))H.push(['in',u('hCable')]);
  if(f==='deskL'&&!on('OF-LIFTMEM'))H.push(['in',u('hMem')]);
  if(CHAIR.includes(f)&&!on('OF-LUMB'))H.push(['in',u('hLumb')]);
  if(f==='panel'&&q<6)H.push(['in',u('hPanel')]);
  if(f==='booth')H.push(['in',u('hBooth')]);
  if(q>=6&&!on('OF-LAYOUT'))H.push(['in',u('hLayout')]);
  if(q<3)H.push(['in',u('hVol3')]);
  else if(q<5)H.push(['in',u('hVol5')]);
  else if(q<10)H.push(['in',u('hVol10')]);
  if(p.stock<q)H.push(['',p.stock>0?u('hStockPart',p.stock,p.lead):u('hStockNone',p.lead)]);
  if(!H.some(h=>h[0]===''))H.unshift(['ok',u('hOk')]);
  return H;
}
function discPct(isDev,vp,gp){return isDev?Math.round((100-(100-vp)*(100-gp)/100)*100)/100:gp}
function buildPayload(){
  const t=totals(),c=S.cust,dt=new Date(),vu=new Date(dt.getTime()+30*864e5),iso=d=>d.toISOString().slice(0,10);
  const code=cfgCode();
  return {
    quote:{externalDocumentNumber:(c.ref.trim()||code).slice(0,35),customerNumber:c.bcno.trim()||null,customerName:c.name.trim(),vatRegistrationNumber:c.vat.replace(/\s/g,'').toUpperCase(),email:c.email.trim(),documentDate:iso(dt),validUntilDate:iso(vu),currencyCode:'EUR',customerPriceGroup:c.group},
    lines:[{lineType:'Comment',description:(u('cfgComment')+' '+code+(c.notes.trim()?' - '+c.notes.trim():'')).slice(0,100)}].concat(
      t.L.map((l,i)=>({lineType:'Item',lineObjectNumber:l.id,description:String(trn(l.name)).slice(0,100),quantity:l.qty,unitPrice:l.unit,discountPercent:l.unit===0?0:discPct(i===0,t.vp,t.gp)})))
  };
}

const GRPSEP={};const eur=n=>{const L=LOCALE[LANG];let s=new Intl.NumberFormat(L,{style:'currency',currency:'EUR',useGrouping:'always'}).format(n);const a=Math.abs(n);if(a>=1000&&a<10000){const g=GRPSEP[L]||(GRPSEP[L]=(new Intl.NumberFormat(L).formatToParts(1234567).find(x=>x.type==='group')||{value:'.'}).value);if(s.indexOf(g)<0)s=s.replace(/(\d)(\d{3})(?=[.,]\d{2})/,'$1'+g+'$2')}return s};

const shade=(hex,f)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const m=f<0?0:255,a=Math.abs(f);r=Math.round(r+(m-r)*a);g=Math.round(g+(m-g)*a);b=Math.round(b+(m-b)*a);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)};
function defSel(p){const s={};O.forEach(x=>{if(x.fam.includes(p.fam)&&x.def&&x.def.includes(p.fam))s[x.id]=1});return s}
function visOf(p,cur){
  const sel=cur?S.sel:defSel(p);
  const has=id=>{const x=OBJ[id];return !!x&&x.fam.includes(p.fam)&&((x.incl&&x.incl.includes(p.fam))||(sel[id]||0)>0)};
  const V={w:p.dim[0],d:p.dim[1],h:p.dim[2],top:'#F1EFEA',frame:'#ECECE8',fabric:'#8F9297',has};
  O.forEach(x=>{if(!has(x.id))return;if(x.v)Object.assign(V,x.v);if(x.sw){if(x.grp==='top')V.top=x.sw;if(x.grp==='frame')V.frame=x.sw;if(x.grp==='fabric')V.fabric=x.sw}});
  return V;
}
const G=286,LN='stroke="rgba(0,0,0,.28)" stroke-width="1" stroke-linejoin="round"';
const R=(x,y,w,h,f,rx)=>'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(0,w).toFixed(1)+'" height="'+Math.max(0,h).toFixed(1)+'"'+(rx?' rx="'+rx+'"':'')+' fill="'+f+'" '+LN+'/>';
const PL=(pts,f)=>'<polygon points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="'+f+'" '+LN+'/>';
/* parallelepipedo in proiezione obliqua: fronte, faccia superiore, fianco destro */

function go(n){
  n=Math.min(n,maxStep());if(n<1||swapping)return;
  const d=n>=S.step?1:-1,m=$('#main');
  const finish=()=>{S.step=n;dirNow=d;render();$('#top').scrollIntoView({block:'start'})};
  if(reduce||n===S.step){finish();return}
  swapping=true;m.dataset.leave=d>0?'f':'b';sweep(d);
  setTimeout(()=>{delete m.dataset.leave;finish();swapping=false},230);
}

function validate(show){
  const c=S.cust,vt=c.vat.replace(/\s/g,'').toUpperCase(),v={name:c.name.trim()?'':u('vName'),vat:(/^(IT)?\d{11}$/.test(vt)||/^[A-Z]{2}[0-9A-Z]{8,12}$/.test(vt))?'':u('vVat'),email:/^\S+@\S+\.\S+$/.test(c.email)?'':u('vEmail')};
  if(show)for(const k in v){const e=$('#e-'+k),i=$('#f-'+k);if(e){e.textContent=v[k];i.setAttribute('aria-invalid',v[k]?'true':'false')}}
  return !Object.values(v).some(Boolean);
}

/* Adapter Business Central */
const BC={cfg:{mode:'demo',tenant:'',env:'production',company:'',proxy:''},
  sleep:ms=>new Promise(r=>setTimeout(r,ms)),
  async createQuote(pl){
    if(this.cfg.mode==='demo'){await this.sleep(900);return {demo:true,number:'OFF-'+(10000+Math.floor(Math.random()*89999))}}
    if(!this.cfg.proxy)throw new Error(u('errProxy'));
    try{
      const base=this.cfg.proxy.replace(/\/$/,'')+'/companies('+this.cfg.company+')';
      const q=await fetch(base+'/salesQuotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pl.quote)});
      if(!q.ok)throw new Error(u('errQuote',q.status));
      const doc=await q.json();
      for(const l of pl.lines){
        const r=await fetch(base+'/salesQuotes('+doc.id+')/salesQuoteLines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(l)});
        if(!r.ok)throw new Error(u('errLine',l.lineObjectNumber||u('comment'),r.status));
      }
      return {demo:false,number:doc.number};
    }catch(e){
      if(e instanceof TypeError)throw new Error(u('errNet'));
      throw e;
    }
  },
  async ping(){
    if(this.cfg.mode==='demo')return u('pingDemo');
    if(!this.cfg.proxy)return u('pingNoProxy');
    try{const r=await fetch(this.cfg.proxy.replace(/\/$/,'')+'/companies('+this.cfg.company+')/items?$top=1');return r.ok?u('pingOk'):u('pingStatus',r.status)}
    catch(e){return u('pingBlocked')}
  }
};
async function submit(){
  S.tried=true;
  if(S.step!==4){go(4);return}
  if(!validate(true)){toast(u('completeCust'));const e=document.querySelector('[aria-invalid="true"]');if(e)e.focus();return}
  S.busy=true;S.payload=buildPayload();render();
  try{S.result=await BC.createQuote(S.payload)}catch(e){S.result={error:e.message}}
  S.busy=false;render();
}
async function copy(){
  const txt=$('#payload').textContent;
  try{await navigator.clipboard.writeText(txt);toast(u('jsonCopied'))}
  catch(e){const r=document.createRange();r.selectNodeContents($('#payload'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast(u('selectedText'))}
}
function bcLabel(){
  const live=BC.cfg.mode==='live';
  $('#bclabel').textContent='Business Central · '+(live?'Live':'Demo');
  $('#bcdot').classList.toggle('live',live);
}
const act={
  care:d=>{S.care=S.care===d.id?null:d.id;render()},
  cat:d=>{if(S.cat!==d.id){S.cat=d.id;S.pid=null;S.sel={};S.result=null;S.payload=null}go(2)},
  prod:d=>{S.pid=d.id;S.qty=1;initSel();S.result=null;S.payload=null;
    const img=document.querySelector('.pcard[data-id="'+d.id+'"] .art svg');
    if(document.startViewTransition&&!reduce&&img&&S.step===2&&!swapping){
      img.style.viewTransitionName='hero';viaVT=true;
      const vt=document.startViewTransition(()=>{img.style.viewTransitionName='';S.step=3;dirNow=1;render();window.scrollTo(0,0);const h=document.querySelector('#stage .unit.front .pi');if(h)h.style.viewTransitionName='hero'});
      vt.finished.finally(()=>{const h=document.querySelector('#stage .unit.front .pi');if(h)h.style.viewTransitionName=''});
    }else go(3)},
  scene:d=>{S.scene=d.id;render()},
  focusopt:d=>{const i=document.querySelector('[data-opt="'+d.id+'"]')||document.querySelector('.opt [data-id="'+d.id+'"]');const o=i&&i.closest('.opt');if(!o)return;o.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});o.classList.remove('flash');void o.offsetWidth;o.classList.add('flash')},
  bom:()=>openBom(true),
  bomclose:()=>openBom(false),
  share:()=>openShare(),
  shclose:()=>{$('#shov').hidden=true},
  shcopy:async()=>{const v=$('#shlink').value;try{await navigator.clipboard.writeText(v);toast(u('linkCopied'))}catch(e){const i=$('#shlink');i.focus();i.select();toast(u('selectedText'))}},
  go:d=>go(+d.n),
  preset:d=>{applyPreset(PRESETS.find(x=>x.id===d.id));go(3)},
  sample:()=>{Object.assign(S.cust,u('sample'));S.payload=null;render()},
  lang:d=>setLang(d.l,true),
  next:()=>go(S.step+1),
  qty:d=>{S.qty=Math.min(99,Math.max(1,S.qty+ +d.d));S.payload=null;render()},
  oq:d=>{const x=OBJ[d.id],c=Math.max(0,(S.sel[d.id]||0)+ +d.d);if(c===0){delete S.sel[d.id];prune()}else turnOn(d.id,c);S.payload=null;render()},
  submit:()=>submit(),
  copy:()=>copy(),
  tosum:()=>{if(document.body.classList.contains('stage-mode'))openBom(true);else $('#sum').scrollIntoView({block:'start'})},
  theme:()=>setTheme(),
  bc:()=>{$('#bcm-'+BC.cfg.mode).checked=true;$('#bc-tenant').value=BC.cfg.tenant;$('#bc-env').value=BC.cfg.env;$('#bc-company').value=BC.cfg.company;$('#bc-proxy').value=BC.cfg.proxy;$('#bcmsg').textContent='';$('#bcov').hidden=false;$('#bcm-'+BC.cfg.mode).focus()},
  bcclose:()=>{$('#bcov').hidden=true},
  bcsave:()=>{BC.cfg={mode:document.querySelector('[name=bcm]:checked').value,tenant:$('#bc-tenant').value.trim(),env:$('#bc-env').value.trim()||'production',company:$('#bc-company').value.trim(),proxy:$('#bc-proxy').value.trim()};bcLabel();$('#bcmsg').textContent=u('saved')},
  bctest:async()=>{act.bcsave();$('#bcmsg').textContent=u('testing');$('#bcmsg').textContent=await BC.ping()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.tagName!=='BUTTON'&&e.target.closest('button')&&e.target.closest('button')!==t)return;
  act[t.dataset.act]&&act[t.dataset.act](t.dataset);
});
document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.opt;if(!id)return;
  if(id.startsWith('none:')){const g=id.slice(5);O.filter(x=>x.grp===g).forEach(x=>{delete S.sel[x.id]});prune()}
  else if(e.target.checked)turnOn(id,1);
  else{delete S.sel[id];prune()}
  S.payload=null;render();
});
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  S.cust[f]=e.target.value;S.payload=null;
  if(f==='group')renderSummary();
  if(S.tried)validate(true);
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#bcov').hidden)act.bcclose();else if(!$('#shov').hidden)act.shclose();else if($('#sum').classList.contains('open'))openBom(false)});
$('#shov').addEventListener('click',e=>{if(e.target===$('#shov'))act.shclose()});
$('#bcov').addEventListener('click',e=>{if(e.target===$('#bcov'))act.bcclose()});

/* Effetti del puntatore: luce e inclinazione */
document.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||reduce)return;
  const c=e.target.closest&&e.target.closest('.panel');if(!c)return;
  const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  c.style.setProperty('--x',x+'px');c.style.setProperty('--y',y+'px');
  if(c.matches('.ccard,.pcard')){c.style.setProperty('--ry',((x/r.width-.5)*9).toFixed(2)+'deg');c.style.setProperty('--rx',(-(y/r.height-.5)*9).toFixed(2)+'deg')}
});
document.addEventListener('pointerout',e=>{
  const c=e.target.closest&&e.target.closest('.ccard,.pcard');
  if(c&&!c.contains(e.relatedTarget)){c.style.removeProperty('--rx');c.style.removeProperty('--ry')}
});

/* Vista tecnica in pianta: ingombro del prodotto configurato, con quote in cm. */
const cv=$('#trace'),cx=cv.getContext('2d');
let W=0,H=0,last=0,scanT=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=Math.max(1,W*d);cv.height=Math.max(1,H*d);cx.setTransform(d,0,0,d,0,0);draw()}
function arrowDim(x1,y1,x2,y2,label,fg,fm,vert){
  cx.strokeStyle=fg;cx.fillStyle=fg;cx.globalAlpha=.85;cx.lineWidth=1;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();
  const tk=4;cx.beginPath();if(vert){cx.moveTo(x1-tk,y1);cx.lineTo(x1+tk,y1);cx.moveTo(x2-tk,y2);cx.lineTo(x2+tk,y2)}else{cx.moveTo(x1,y1-tk);cx.lineTo(x1,y1+tk);cx.moveTo(x2,y2-tk);cx.lineTo(x2,y2+tk)}cx.stroke();
  cx.font='500 10px '+fm;cx.textAlign='center';
  if(vert){cx.save();cx.translate(x1+12,(y1+y2)/2);cx.rotate(-Math.PI/2);cx.fillText(label,0,0);cx.restore()}else cx.fillText(label,(x1+x2)/2,y1+14);
  cx.globalAlpha=1;cx.textAlign='left';
}
function draw(){
  if(!W)return;
  const cs=getComputedStyle(document.documentElement),bg=cs.getPropertyValue('--scr').trim(),fg=cs.getPropertyValue('--scr-trace').trim(),fm=cs.getPropertyValue('--f-m');
  cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  cx.strokeStyle=fg;cx.globalAlpha=.07;cx.lineWidth=1;cx.beginPath();
  for(let x=0;x<W;x+=8){cx.moveTo(x+.5,0);cx.lineTo(x+.5,H)}for(let y=0;y<H;y+=8){cx.moveTo(0,y+.5);cx.lineTo(W,y+.5)}cx.stroke();
  cx.globalAlpha=.16;cx.beginPath();
  for(let x=0;x<W;x+=40){cx.moveTo(x+.5,0);cx.lineTo(x+.5,H)}for(let y=0;y<H;y+=40){cx.moveTo(0,y+.5);cx.lineTo(W,y+.5)}cx.stroke();
  cx.globalAlpha=.8;cx.fillStyle=fg;cx.font='500 10px '+fm;cx.fillText(u('planLbl'),10,16);cx.globalAlpha=1;
  const p=S.pid?prod():null;
  if(!p){cx.globalAlpha=.7;cx.textAlign='center';cx.fillText(u('planEmpty'),W/2,H/2+4);cx.textAlign='left';cx.globalAlpha=1;return}
  const V=visOf(p,true),w=V.w,d=Math.max(V.d,4),f=p.fam;
  const sc=Math.min((W-110)/w,(H-62)/d),rw=w*sc,rh=d*sc,x0=(W-rw)/2-8,y0=26+(H-50-rh)/2;
  cx.shadowColor=fg;cx.shadowBlur=10;cx.strokeStyle=fg;cx.lineWidth=1.6;cx.fillStyle=fg;cx.globalAlpha=.12;
  if(CHAIR.includes(f)){cx.beginPath();cx.arc(x0+rw/2,y0+rh/2,rw/2,0,Math.PI*2);cx.fill();cx.globalAlpha=1;cx.stroke()}
  else{cx.fillRect(x0,y0,rw,rh);cx.globalAlpha=1;cx.strokeRect(x0,y0,rw,rh)}
  cx.shadowBlur=0;cx.lineWidth=1;cx.globalAlpha=.55;cx.beginPath();
  if(f==='bench'){cx.moveTo(x0,y0+rh/2);cx.lineTo(x0+rw,y0+rh/2)}
  if(f==='tableM'){const n=Math.round(w/70);for(let i=0;i<n;i++){const x=x0+rw*(i+.5)/n;cx.moveTo(x+7,y0-9);cx.arc(x,y0-9,7,0,Math.PI*2);cx.moveTo(x+7,y0+rh+9);cx.arc(x,y0+rh+9,7,0,Math.PI*2)}}
  if(f==='lock'||f==='cab'){const n=f==='lock'?2:2;for(let i=1;i<n;i++){cx.moveTo(x0+rw*i/n,y0);cx.lineTo(x0+rw*i/n,y0+rh)}}
  if(DESK.includes(f)&&(V.has('OF-MARM1')||V.has('OF-MARM2'))){cx.moveTo(x0+rw*.3,y0+rh*.18);cx.lineTo(x0+rw*.7,y0+rh*.18)}
  cx.stroke();cx.globalAlpha=1;
  arrowDim(x0,y0+rh+(f==='tableM'?24:12),x0+rw,y0+rh+(f==='tableM'?24:12),w+' cm',fg,fm,false);
  if(!CHAIR.includes(f))arrowDim(x0+rw+14,y0,x0+rw+14,y0+rh,d+' cm',fg,fm,true);
  if(S.qty>1){cx.font='500 10px '+fm;cx.textAlign='right';cx.fillText('× '+S.qty,W-10,16);cx.textAlign='left'}
  if(!reduce){const sx=x0+((scanT%1.4)/1.4)*(rw+40)-20;const g=cx.createLinearGradient(sx-30,0,sx,0);g.addColorStop(0,'transparent');g.addColorStop(1,fg);cx.globalAlpha=.18;cx.fillStyle=g;cx.fillRect(sx-30,y0-4,30,rh+8);cx.globalAlpha=1}
}
function loop(ts){
  if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;
  if(!document.hidden){scanT+=dt*.6;draw()}
  requestAnimationFrame(loop);
}
if('ResizeObserver' in window)new ResizeObserver(size).observe(cv);
size();
if(!reduce)requestAnimationFrame(loop);

/* Tema chiaro / scuro */
const root=document.documentElement,mq=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>{const t=root.dataset.theme;return t?t==='dark':mq.matches};
function themeUI(){const d=isDark(),b=$('#tgl');b.dataset.mode=d?'dark':'light';b.setAttribute('aria-label',d?u('toLight'):u('toDark'));b.title=u('themeTitle');$('#tgllabel').textContent=d?u('lightShort'):u('darkShort');if(reduce)draw()}
function setTheme(){const n=isDark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('cl-theme',n)}catch(e){}themeUI()}
try{const t=localStorage.getItem('cl-theme');if(t==='light'||t==='dark')root.dataset.theme=t}catch(e){}
new MutationObserver(themeUI).observe(root,{attributes:true,attributeFilter:['data-theme']});
if(mq.addEventListener)mq.addEventListener('change',themeUI);
/* Lingua */
function applyStatic(){
  document.querySelectorAll('[data-i18n]').forEach(e=>{e.textContent=u(e.dataset.i18n)});
  document.querySelectorAll('[data-i18n-html]').forEach(e=>{e.innerHTML=u(e.dataset.i18nHtml)});
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>{e.setAttribute('aria-label',u(e.dataset.i18nAria))});
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>{e.setAttribute('placeholder',u(e.dataset.i18nPh))});
  document.title=u('title');root.lang=LOCALE[LANG];
  const k=LANGS.indexOf(LANG);$('#lang').style.setProperty('--k',k);
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===LANG)));
}
function setLang(l,user){
  if(!LANGS.includes(l)||(user&&l===LANG))return;
  LANG=l;
  if(user){try{localStorage.setItem('cl-lang',l)}catch(e){}}
  applyStatic();themeUI();
  if(S.payload)S.payload=buildPayload();
  render();
  if(user&&!reduce)['#main','#sumbody'].forEach(q=>{const e=$(q);e.classList.remove('relang');void e.offsetWidth;e.classList.add('relang')});
}
(function(){let l=null;try{l=localStorage.getItem('cl-lang')}catch(e){}
  if(!LANGS.includes(l)){const n=(navigator.languages&&navigator.languages[0]||navigator.language||'it').slice(0,2).toLowerCase();l=LANGS.includes(n)?n:'it'}
  LANG=l;applyStatic();})();
let restored=false;if(location.hash.indexOf('#c-')===0)restored=cfgUnpack(location.hash.slice(3));
themeUI();
render();
bcLabel();
if(restored)toast(u('restored'));
})();
</script>
